name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # 单元测试和代码质量检查
  unit-test:
    runs-on: ubuntu-latest

    services:
      # MySQL 8.0：单元测试依赖数据库
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: vnerp_test
          MYSQL_USER: test
          MYSQL_PASSWORD: test123
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      # Redis 7：缓存与会话依赖
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: test
      DB_PASSWORD: test123
      DB_NAME: vnerp_test
      REDIS_URL: redis://127.0.0.1:6379
      JWT_SECRET: test-jwt-secret
      NODE_ENV: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # fetch-depth: 0 —— lint-gate 需要解析基线 ref（origin/main）来算改动集合。
          # 默认 fetch-depth: 1 会让基线不可解析 → 红线检查静默放行（或退出 2 失败关闭）。
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # 不指定 version，自动读取 package.json 的 packageManager 字段（pnpm@9.0.0）

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Drizzle guard check (block FK-drop footguns)
        run: node scripts/guard-drizzle-kit.cjs check

      - name: Run linter
        run: pnpm lint

      - name: Run lint gate
        run: pnpm lint:gate

      # 权限码词汇表一致性门槛：纯静态解析 permissions-catalog.ts + messages/*.json，
      # 不连库，可放在最前面快速失败。
      - name: Run permission vocabulary gate
        run: pnpm validate:permissions

      # SQL 可执行性门槛需要一个装了结构的库：CI 的 MySQL service 只建了空库，
      # 先跑 setup:db 把结构导入，EXPLAIN 才有意义。
      # 这里刻意用 database/ci_schema.sql 而不是默认的 vnerpdacahng_schema.sql：
      # 后者是 2026-07-07 的二手快照（162 表），只有 prod（349 表 + 6 视图）的 45%，
      # EXPLAIN 会把所有「引用缺失表」的语句判成缺陷 —— 实测 2000+ 条误报。
      - name: Prepare DB schema for SQL gate
        run: pnpm setup:db --schema=database/ci_schema.sql

      - name: Run SQL executable gate
        run: pnpm validate:sql

      # 幽灵列/幽灵表门槛（validate-sql-ghost）：同样是 EXPLAIN 反证，但补上了
      # validate:sql 的两个盲区 —— ① 范围扩到全 src（后者只扫 src/app/api）；
      # ② 覆盖 INSERT/UPDATE/DELETE（后者只抽 ^(SELECT|WITH)）。
      # 与前者共用「Prepare DB schema for SQL gate」导入的结构，必须跟在它后面。
      - name: Run SQL ghost-column gate
        run: pnpm validate:sql-ghost

      - name: Run TypeScript check
        run: pnpm ts-check

      - name: Run unit tests with coverage
        run: pnpm test:coverage
        # vitest.config.ts 已配置覆盖率阈值卡点：
        # lines/functions 80、branches 70、statements 80
        # 不达标时 vitest 以非零退出码退出，CI 自动失败

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/

  # E2E测试
  e2e-test:
    runs-on: ubuntu-latest
    needs: unit-test

    services:
      # MySQL 8.0：E2E 测试通过应用访问数据库
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: vnerp_test
          MYSQL_USER: test
          MYSQL_PASSWORD: test123
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      # Redis 7：缓存与会话依赖
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: test
      DB_PASSWORD: test123
      DB_NAME: vnerp_test
      REDIS_URL: redis://127.0.0.1:6379
      JWT_SECRET: test-jwt-secret
      NODE_ENV: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm test:install

      - name: Build application
        run: pnpm build

      # 服务器由 Playwright webServer 配置自动管理（见 playwright.config.ts）
      # 移除手动 pnpm start & + wait-on，避免与 webServer 端口冲突

      - name: Run E2E tests
        run: pnpm test

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/

  # ============================================================
  # Docker 镜像构建并推送到 GHCR（GitHub Container Registry）
  # 仅 main 分支推送时触发
  # ============================================================
  docker-publish:
    runs-on: ubuntu-latest
    needs: [unit-test, e2e-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest
            type=raw,value={{date('YYYYMMDD')}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # 自动部署到生产服务器
  # 通过 SSH 连接服务器，拉取最新镜像并滚动更新
  # 需配置 GitHub Secrets（见 docs/04-运维指南/Docker部署指南.md）
  # ============================================================
  deploy:
    runs-on: ubuntu-latest
    needs: docker-publish
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - name: Deploy to production server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            cd ${{ secrets.DEPLOY_PATH || '/opt/vnerp' }}
            git pull origin main
            docker compose -f docker-compose.prod.yml --env-file .env.production pull app
            docker compose -f docker-compose.prod.yml --env-file .env.production up -d --no-deps --force-recreate app
            echo "等待 app 健康检查（最多 60 秒）..."
            for i in $(seq 1 30); do
              if docker inspect --format='{{.State.Health.Status}}' vnerp-app-prod 2>/dev/null | grep -q healthy; then
                echo "✅ 部署成功：app 已健康运行"
                docker image prune -f
                exit 0
              fi
              sleep 2
            done
            echo "⚠️ 警告：app 未通过健康检查（60秒超时），请手动检查日志"
            docker compose -f docker-compose.prod.yml logs --tail=50 app
